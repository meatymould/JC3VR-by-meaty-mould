; JC3VR 0.0.1-prealpha.1 configuration.
; Emergency off switch: set enabled=0 and JC3VR installs nothing (the game runs normally).
; Home/End and Page Up/Down in game adjust hud_scale / hud_distance_m (and the map screen while it is open).
[JC3VR]
; Optional OpenXR controller vibration. Set controller_haptics=0 to disable.
controller_haptics=1
haptic_intensity=0.7
; Head yaw steers native helicopter turn controls; manual rudder overrides.
helicopter_head_steering=1
; Keep full crouch range independent of the horizontal room-movement limit.
six_dof_vertical_limit_m=1.8
tracked_hands=0
controller_model=1
enabled=1
debug_logging=1
head_tracking=1
head_look_mode=direct_camera
positional_tracking=1
world_scale=1.0
six_dof=1
six_dof_scale=1.0
six_dof_limit_m=0.65
recenter_key=F2
motion_controllers=1
debug_overlay=0
shadow_probe=0
head_yaw_scale=1.0
head_pitch_scale=1.0
camera_shake_scale=0.25
camera_mode=first_person
stereo_mode=native_alternate
show_body=1
show_head_mesh=1
near_clip=0.05
geo11_swap_eyes=0
stereo_source=proper_sbs
geo11_log_extraction_every_frame=0
jc3_world_units_per_meter=1.0
native_stereo_rig_mode=native_stereo
native_camera_probe_enabled=0
native_projection_override=1
force_native_projection_buffer=0
sync_native_view_projection=1
sync_native_projection_to_xr=1
sync_paired_camera_at_upload=1
native_eye_capture=1
stereo_coherence_probe=0
sync_native_culling_camera=1
vr_gamepad=1
engine_follow_head=1
hand_aim=1
paired_eye_submission=0
reproject_to_frame_pose=1
vr_body=1
vr_body_hide_head=1
vr_body_hand_aim_frame=1
vr_body_hide_all=1
hud_distance_m=3
hud_scale=0.65
menu_distance_m=4
menu_scale=0.55
